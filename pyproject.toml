[project]
name = "mcpfleet-obs"
version = "0.3.0"
description = "Shared error taxonomy, metrics, and client tracking for the mcpfleet MCP servers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Paul Boucher" },
]
dependencies = [
    "fastmcp>=3.2.3,<4",
    "prometheus-client>=0.20",
    "pydantic>=2.7",
    "httpx>=0.27",
    "starlette>=1.0.1",
]

[project.urls]
Homepage = "https://github.com/uk-agents/mcpfleet-obs"
Repository = "https://github.com/uk-agents/mcpfleet-obs"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpfleet_obs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
